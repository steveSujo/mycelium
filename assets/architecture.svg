<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%" style="font-family: system-ui, -apple-system, sans-serif; background: #0b0f19; color: #f8fafc; border-radius: 12px;">
  <defs>
    <style>
      .bg { fill: #0b0f19; }
      .box { fill: #1e293b; stroke: #334155; stroke-width: 2; rx: 8; }
      .accent-box { fill: #1e293b; stroke: #3b82f6; stroke-width: 2; rx: 8; }
      .title { font-weight: 700; font-size: 16px; fill: #f8fafc; }
      .subtitle { font-size: 13px; fill: #94a3b8; }
      .label { font-size: 14px; font-weight: 600; fill: #e2e8f0; }
      .desc { font-size: 12px; fill: #94a3b8; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="12"/>

  <!-- Application Layer -->
  <rect x="50" y="30" width="700" height="70" class="box" />
  <text x="75" y="60" class="title">Application Layer</text>
  <text x="75" y="80" class="subtitle">Custom Rust Daemons, Edge Services, or C/C++ FFI Consumers</text>

  <!-- Arrow down -->
  <path d="M 400 100 L 400 130" class="arrow" />

  <!-- FFI / Core Interface -->
  <rect x="50" y="140" width="700" height="70" class="accent-box" />
  <text x="75" y="170" class="title">mycelium_ffi (C ABI Bindings)</text>
  <text x="75" y="190" class="subtitle">Opaque pointers, catch_unwind safety guards, cbindgen generated headers</text>

  <!-- Arrow down -->
  <path d="M 400 210 L 400 240" class="arrow" />

  <!-- Core Layer -->
  <rect x="50" y="250" width="700" height="210" class="box" />
  <text x="75" y="280" class="title">mycelium_core (Engine)</text>

  <!-- Sub-boxes -->
  <rect x="80" y="305" width="190" height="130" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="100" y="330" class="label">Node State</text>
  <text x="100" y="355" class="desc">• UUID v4 Node ID</text>
  <text x="100" y="375" class="desc">• Incarnation tracking</text>
  <text x="100" y="395" class="desc">• Disk Persistence</text>

  <rect x="290" y="305" width="220" height="130" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="310" y="330" class="label">Gossip &amp; CRDT</text>
  <text x="310" y="355" class="desc">• LWW-CRDT Peer Table</text>
  <text x="310" y="375" class="desc">• 2-Version Ring Buffer</text>
  <text x="310" y="395" class="desc">• Delta Sync &amp; GC</text>

  <rect x="530" y="305" width="190" height="130" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="550" y="330" class="label">Network Transport</text>
  <text x="550" y="355" class="desc">• UDP Multicast / Unicast</text>
  <text x="550" y="375" class="desc">• 16-byte Binary Framing</text>
  <text x="550" y="395" class="desc">• CRC32-C Checksums</text>
</svg>
